# Render Blueprint for the aiPHeed API (backend/). The frontend is on Vercel and reaches this service through the
# /api rewrite in frontend/vercel.json, so the browser sees one origin and the refresh cookie stays SameSite=Strict.
services:
  - type: web
    name: aipheed-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # a persistent disk needs a paid plan; the free plan sleeps and loses the database
    region: singapore
    branch: main
    healthCheckPath: /api/v1/config
    disk:
      name: aipheed-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/aipheed.db
      - key: SECRET_KEY
        generateValue: true
      # Thesis model E168 (LightGBM). AIPHEED_LEAD2_MODEL must stay unset: a Lead-2 research mode switches the E168 overlay off.
      - key: AIPHEED_THESIS_MODEL
        value: e168
      - key: AIPHEED_STRICT_MODEL
        value: "1"
      - key: FRONTEND_BASE_URL
        sync: false          # set to the Vercel URL, e.g. https://aipheed-frontend.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
